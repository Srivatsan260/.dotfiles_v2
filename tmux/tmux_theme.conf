# GitHub Dark: charcoal surfaces, muted text, and purple accents.
set -g message-command-style "fg=#c9d1d9,bg=default"
set -g mode-style "fg=#c9d1d9,bg=#30363d"
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#a371f7"
set -g message-style "fg=#c9d1d9,bg=default"

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8b949e,bg=default,nobold] #I #W #F "
setw -g window-status-current-format "#[fg=#a371f7,bg=default,bold] #I #W #F #{b:pane_current_path} "

set -g status-style "fg=#8b949e,bg=default"
set -g status-left "#[fg=#0d1117,bg=#a371f7,bold]#{?client_prefix,    󰣐      ,}#[fg=#c9d1d9,bg=default,bold] #S "
set -g status-right "#[fg=#8b949e,bg=default,nobold] %Y-%m-%d | %H:%M "
